    <style>
      /* ---- Localized faces. Inter / Montserrat / JetBrains Mono are renderer-bundled. ---- */
      @font-face {
        font-family: "General Sans";
        src: url("assets/fonts/general-sans-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {

        font-display: block;

        font-weight: 400;
        font-style: normal;
        font-display: block;

      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-italic-400.woff2") format("woff2");
        font-weight: 400;

      /* ---- Palette: apps/web/src/index.css @theme (the landing system) ---- */
      :root {
        --canvas: #05060a;
        --line: #33333a;
        --line-subtle: #242429;
        --ink: #f5f5f7;
        --ink-2: #a3a3ad;
        --ink-3: #8c8c98; /* raised from the app's #6b6b75 to clear WCAG AA on this canvas */
        --signal: #ff6b4a;
        --voice: #8b98f0;
        /* caption preset colours — packages/shared/src/presets.ts */
        --cream: #fff6e9;
        --rang-emph: #e2452a;
        --rang-angry: #ff5c3a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
        font-family: Inter, sans-serif;
        color: var(--ink);
      }

      /* ---------- standing background (untimed: continuous across every scene) ---------- */
      #bg {
        position: absolute;
        inset: 0;
      }
      .grid {
        position: absolute;
        inset: -10%;
        -webkit-mask-image: radial-gradient(70% 65% at 50% 46%, transparent 24%, black 62%);
        mask-image: radial-gradient(70% 65% at 50% 46%, transparent 24%, black 62%);
      }
      .grid-major {
        background-image: linear-gradient(to right, rgba(245, 245, 247, 0.1) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(245, 245, 247, 0.1) 1px, transparent 1px);
        background-size: 220px 220px;
      }
      .grid-minor {
        background-image: linear-gradient(to right, rgba(245, 245, 247, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(245, 245, 247, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
      }
      /* the one audio-reactive element: a coral bloom behind the caption stage */
      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1500px;
        height: 1000px;
        margin: -500px 0 0 -750px;
        background: radial-gradient(
          closest-side,
          rgba(255, 107, 74, 0.2),
          rgba(124, 109, 214, 0.09) 55%,
          transparent 78%
        );
        opacity: 0.55;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(75% 70% at 50% 48%, transparent 38%, rgba(0, 0, 0, 0.72));
      }

      /* ---------- scene scaffolding (shared by every sub-composition) ---------- */
      .scene {
        position: absolute;
        inset: 0;
      }
      .inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        font-weight: 400;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .display {
        font-family: "General Sans", Inter, sans-serif;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.06;
      }
      .coral {
        color: var(--signal);
      }

      /* ---------- caption word faces (mirroring the real presets) ---------- */
      .cap-line {
        display: flex;
        align-items: baseline;
        justify-content: center;
        flex-wrap: wrap;
        row-gap: 10px;
        column-gap: 34px;
      }
      .w {
        display: inline-block;
      }
      /* Rangmanch body */
      .w-body {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 82px;
        color: var(--cream);
      }
      /* Rangmanch emphasis: Anton, UPPERCASE, vermilion */
      .w-emph {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        font-size: 170px;
        color: var(--rang-emph);
        letter-spacing: 0.005em;
      }
      /* default emotion layer: uppercase + weight 900 + colour (+ shake, driven in JS) */
      .w-angry {
        font-family: Montserrat, sans-serif;
        font-weight: 900;

      .emoji {

      /* ---------- S1 ---------- */
      #s1-stack {
        position: relative;
        width: 1640px;
        height: 300px;
      }

      #s4-input {

      }

    <script>
      /* The root timeline owns only the standing background. Each scene's motion
         lives in its own sub-composition timeline and the runtime auto-nests them.

         The single audio-reactive treatment: the coral bloom behind the caption
         stage breathes with the track's bass and overall level. Data is
         pre-extracted to assets/audio-data.js (30fps, same as the render), so a
         frame is a pure function of its index — no Web Audio, no runtime analysis.
         Deliberately not: waveform bars, equalizers, particles, strobing. */
      (function () {
        var FPS = 30;
        var TOTAL = Math.round(21.5 * FPS);
        var RMS = window.AUDIO_RMS || [];
        var BASS = window.AUDIO_BASS || [];
        var glow = document.getElementById("glow");

        function drawFrame(f) {
          var bass = BASS[f] || 0;
          var rms = RMS[f] || 0;
          glow.style.opacity = (0.4 + bass * 0.3).toFixed(3);
          glow.style.transform = "scale(" + (0.97 + rms * 0.06).toFixed(4) + ")";
        }

        var tl = gsap.timeline({ paused: true });
        for (var f = 0; f < TOTAL; f++) {
          tl.call((function (n) { return function () { drawFrame(n); }; })(f), [], f / FPS);
        }
        tl.seek(0);
        window.__timelines["main"] = tl;
      })();
    </script>
