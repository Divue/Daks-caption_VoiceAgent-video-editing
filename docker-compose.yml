# Local dev: only the Python API runs in Docker. Web and Remotion run natively (npm run dev).
services:
  api:
    build: ./services/api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./services/api/app:/srv/app
      - ./packages/shared/fixtures:/srv/fixtures:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
