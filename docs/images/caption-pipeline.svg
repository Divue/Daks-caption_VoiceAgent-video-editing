<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="1000" height="930" role="img" aria-label="Caption pipeline: a clip is uploaded to S3, Sarvam transcribes the text while AWS Transcribe supplies word timings, the two are aligned, prosody and tagging add emphasis, stretch and emotion, and the Project JSON is stored in DynamoDB">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8ba5"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0d182f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="930" fill="#040810"/>
  <rect width="1000" height="930" fill="url(#grid)" opacity="0.55"/>
  <text x="40" y="46" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="4.5" fill="#7c8ba5">CAPTION PIPELINE</text>
  <text x="40" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#61708c">One upload becomes styled captions. Two speech engines run in parallel, then align.</text>

  <rect x="330" y="96" width="340" height="62" rx="12" fill="#0b1321" stroke="#5194fb" stroke-width="1"/>
  <text x="500" y="122" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#5194fb">CREATOR &#183; BROWSER</text>
  <text x="500" y="144" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">uploads a clip</text>
  <line x1="500" y1="158" x2="500" y2="184" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="330" y="186" width="340" height="62" rx="12" fill="#0b1321" stroke="#5194fb" stroke-width="1"/>
  <text x="500" y="212" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#5194fb">S3</text>
  <text x="500" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">media object, presigned upload</text>
  <line x1="500" y1="248" x2="500" y2="274" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="330" y="276" width="340" height="66" rx="12" fill="#0b1321" stroke="#1adfbb" stroke-width="1"/>
  <text x="500" y="302" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#1adfbb">API &#183; FASTAPI</text>
  <text x="500" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">the process route starts the job runner</text>

  <path d="M500 342 V366 H315 V392" fill="none" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M500 342 V366 H685 V392" fill="none" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="500" y="382" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#61708c">IN PARALLEL</text>

  <rect x="170" y="394" width="290" height="66" rx="12" fill="#0b1321" stroke="#a179ff" stroke-width="1"/>
  <text x="315" y="420" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#a179ff">SARVAM</text>
  <text x="315" y="442" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">Hinglish text, no word timings</text>

  <rect x="540" y="394" width="290" height="66" rx="12" fill="#0b1321" stroke="#ff9800" stroke-width="1"/>
  <text x="685" y="420" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#ff9800">AWS TRANSCRIBE hi-IN</text>
  <text x="685" y="442" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">Devanagari + word timings</text>

  <path d="M315 460 V486 H500 V512" fill="none" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M685 460 V486 H500 V512" fill="none" stroke="#7c8ba5" stroke-width="1.4"/>

  <rect x="330" y="514" width="340" height="66" rx="12" fill="#0b1321" stroke="#a179ff" stroke-width="1"/>
  <text x="500" y="540" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#a179ff">ALIGN</text>
  <text x="500" y="562" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">phonetic match, timed Hinglish words</text>

  <rect x="20" y="508" width="292" height="78" rx="10" fill="#0b1321" stroke="#1b2740" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="36" y="532" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#61708c">FALLBACK</text>
  <text x="36" y="554" font-family="system-ui,sans-serif" font-size="13.5" fill="#7c8ba5">no Sarvam text: Bedrock</text>
  <text x="36" y="573" font-family="system-ui,sans-serif" font-size="13.5" fill="#7c8ba5">transliterates Transcribe words</text>
  <line x1="312" y1="547" x2="328" y2="547" stroke="#7c8ba5" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="500" y1="580" x2="500" y2="606" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="330" y="608" width="340" height="66" rx="12" fill="#0b1321" stroke="#1adfbb" stroke-width="1"/>
  <text x="500" y="634" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#1adfbb">PROSODY, librosa</text>
  <text x="500" y="656" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">loudness, pitch and duration per word</text>
  <line x1="500" y1="674" x2="500" y2="700" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="330" y="702" width="340" height="76" rx="12" fill="#0b1321" stroke="#ff7078" stroke-width="1"/>
  <text x="500" y="728" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#ff7078">TAG</text>
  <text x="500" y="750" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">emphasis, stretch, emotion</text>
  <text x="500" y="769" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#7c8ba5">function words discounted, a pause counts toward emphasis</text>

  <rect x="700" y="700" width="280" height="78" rx="10" fill="#0b1321" stroke="#e2da51" stroke-width="1"/>
  <text x="716" y="724" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#e2da51">BEDROCK</text>
  <text x="716" y="746" font-family="system-ui,sans-serif" font-size="13.5" fill="#fdfcff">one pass, a tone per LINE</text>
  <text x="716" y="765" font-family="system-ui,sans-serif" font-size="13" fill="#7c8ba5">angry, excited, neutral</text>
  <line x1="698" y1="739" x2="674" y2="739" stroke="#7c8ba5" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="500" y1="778" x2="500" y2="804" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="240" y="806" width="420" height="62" rx="12" fill="#0b1321" stroke="#1adfbb" stroke-width="1.6"/>
  <text x="450" y="832" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#1adfbb">PROJECT JSON</text>
  <text x="450" y="854" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14.5" fill="#fdfcff">words, timings, emphasis, stretch, emotion</text>
  <line x1="660" y1="837" x2="708" y2="837" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="710" y="806" width="250" height="62" rx="12" fill="#0b1321" stroke="#5194fb" stroke-width="1"/>
  <text x="835" y="832" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#5194fb">DYNAMODB</text>
  <text x="835" y="854" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">project row</text>
</svg>
