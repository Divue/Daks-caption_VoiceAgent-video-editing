<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" width="1000" height="1040" role="img" aria-label="Voice agent: the mic joins a LiveKit room over WebRTC. A LiveKit Agents worker runs a streaming speech-to-text session, AWS Transcribe streaming by default or Sarvam, whose endpointing marks each segment final; there is no separate voice-activity detector. The transcript is forwarded through the room to the editor, which merges segments across a pause. Playback commands are handled in the browser without the model; everything else goes to the planner, which calls tools including Rekognition vision, validates against the schema, and returns patches the editor applies">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8ba5"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1adfbb"/>
    </marker>
    <pattern id="grid2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0d182f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="1040" fill="#040810"/>
  <rect width="1000" height="1040" fill="url(#grid2)" opacity="0.55"/>
  <text x="40" y="46" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="4.5" fill="#7c8ba5">VOICE AGENT</text>
  <text x="40" y="70" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#61708c">A spoken sentence becomes a validated patch. Playback commands never reach the model.</text>

  <rect x="330" y="96" width="340" height="62" rx="12" fill="#0b1321" stroke="#5194fb" stroke-width="1"/>
  <text x="500" y="122" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#5194fb">MIC &#183; BROWSER</text>
  <text x="500" y="144" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fdfcff">the creator speaks</text>
  <line x1="500" y1="158" x2="500" y2="184" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="516" y="176" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#61708c">WEBRTC AUDIO</text>

  <!-- LiveKit, expanded -->
  <rect x="150" y="186" width="700" height="308" rx="14" fill="none" stroke="#a179ff" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="170" y="208" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#a179ff">LIVEKIT</text>

  <rect x="180" y="218" width="640" height="54" rx="10" fill="#0b1321" stroke="#a179ff" stroke-width="1"/>
  <text x="200" y="241" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2.2" fill="#a179ff">ROOM</text>
  <text x="200" y="261" font-family="system-ui,sans-serif" font-size="14" fill="#fdfcff">the mic's audio track comes in, transcript text goes back out</text>
  <line x1="500" y1="272" x2="500" y2="296" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="180" y="298" width="640" height="182" rx="10" fill="#0b1321" stroke="#a179ff" stroke-width="1"/>
  <text x="200" y="321" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2.2" fill="#a179ff">AGENTS WORKER</text>
  <text x="200" y="342" font-family="system-ui,sans-serif" font-size="13.5" fill="#7c8ba5">an AgentSession with speech to text only: no LLM, no TTS, no separate VAD</text>

  <rect x="200" y="354" width="600" height="112" rx="8" fill="#0a1020" stroke="#1b2740" stroke-width="1"/>
  <text x="218" y="375" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#7c8ba5">STREAMING SPEECH TO TEXT</text>
  <rect x="218" y="386" width="276" height="46" rx="7" fill="#0b1321" stroke="#ff9800" stroke-width="1"/>
  <text x="356" y="405" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#ff9800">AWS TRANSCRIBE</text>
  <text x="356" y="423" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#fdfcff">streaming, the default</text>
  <rect x="506" y="386" width="276" height="46" rx="7" fill="#0b1321" stroke="#e2da51" stroke-width="1"/>
  <text x="644" y="405" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#e2da51">SARVAM</text>
  <text x="644" y="423" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#fdfcff">opt in, when streaming is denied</text>
  <text x="500" y="454" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#7c8ba5">the engine's own endpointing marks each segment final</text>

  <line x1="500" y1="494" x2="500" y2="520" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="516" y="512" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#61708c">TRANSCRIPT, THROUGH THE ROOM</text>

  <rect x="290" y="522" width="420" height="66" rx="12" fill="#0b1321" stroke="#1adfbb" stroke-width="1"/>
  <text x="500" y="548" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#1adfbb">EDITOR</text>
  <text x="500" y="570" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14.5" fill="#fdfcff">merges segments across a pause, then routes</text>

  <path d="M500 588 V612 H180 V636" fill="none" stroke="#1adfbb" stroke-width="1.4" marker-end="url(#g)"/>
  <path d="M500 588 V612 H660 V636" fill="none" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="30" y="638" width="300" height="118" rx="12" fill="#0b1321" stroke="#1adfbb" stroke-width="1"/>
  <text x="180" y="664" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.2" fill="#1adfbb">LOCAL INTENTS</text>
  <text x="180" y="688" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fdfcff">play, pause, seek, speed,</text>
  <text x="180" y="707" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fdfcff">undo, redo, etc.</text>
  <text x="180" y="738" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#1adfbb">NO MODEL CALL</text>

  <rect x="470" y="638" width="380" height="76" rx="12" fill="#0b1321" stroke="#ff9800" stroke-width="1"/>
  <text x="660" y="664" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.2" fill="#ff9800">PLANNER</text>
  <text x="660" y="686" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14.5" fill="#fdfcff">Bedrock Converse tool loop</text>
  <text x="660" y="705" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#7c8ba5">the transcript is passed as data, never as instructions</text>
  <line x1="660" y1="714" x2="660" y2="740" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="470" y="742" width="380" height="82" rx="12" fill="#0b1321" stroke="#a179ff" stroke-width="1"/>
  <text x="660" y="768" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.2" fill="#a179ff">TOOLS</text>
  <text x="660" y="790" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fdfcff">words, style, preset segments,</text>
  <text x="660" y="809" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fdfcff">media layers, vision, etc.</text>

  <rect x="880" y="742" width="100" height="82" rx="10" fill="#0b1321" stroke="#ff7078" stroke-width="1"/>
  <text x="930" y="772" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.2" fill="#ff7078">REKOGNITION</text>
  <text x="930" y="792" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#fdfcff">labels</text>
  <text x="930" y="810" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#fdfcff">faces</text>
  <line x1="852" y1="783" x2="876" y2="783" stroke="#7c8ba5" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="660" y1="824" x2="660" y2="850" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="470" y="852" width="380" height="66" rx="12" fill="#0b1321" stroke="#e2da51" stroke-width="1"/>
  <text x="660" y="878" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.2" fill="#e2da51">VALIDATION</text>
  <text x="660" y="900" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14.5" fill="#fdfcff">every patch checked against the schema</text>

  <path d="M470 885 H300 V981 H330" fill="none" stroke="#7c8ba5" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M180 756 V981 H328" fill="none" stroke="#1adfbb" stroke-width="1.4" marker-end="url(#g)"/>

  <rect x="330" y="950" width="340" height="62" rx="12" fill="#0b1321" stroke="#1adfbb" stroke-width="1.6"/>
  <text x="500" y="976" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#1adfbb">EDITOR APPLIES THE PATCH</text>
  <text x="500" y="998" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14.5" fill="#fdfcff">one agent turn, one undo</text>
</svg>
